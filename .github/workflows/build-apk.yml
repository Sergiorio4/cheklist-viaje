name: Generar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          echo "SDK: $ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ChecklistViaje.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChecklistViaje-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Checklist de Viaje (compilación ${{ github.run_number }})
          body: Descargá ChecklistViaje.apk desde el teléfono e instalalo.
          make_latest: true
          files: ChecklistViaje.apk
